<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QzzCityRestaurant Admin</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f4f4;color:#111}
header{background:#111;color:#fff;text-align:center;padding:18px;border-bottom:5px solid #ffd400}
header h1{color:#ffd400;margin:0}.box,.login{max-width:850px;margin:15px auto;padding:15px}
section,.login{background:#fff;padding:18px;margin-bottom:15px;border-radius:10px;box-shadow:0 2px 7px #ccc}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:6px;font-size:16px}
input,select,textarea{border:1px solid #ccc}button{border:0;font-weight:bold}
.loginBtn{background:#ffd400}.add{background:#20b15a;color:#fff}.save{background:#1769aa;color:#fff}
.logout{background:#d93025;color:#fff;width:auto;float:right}.item{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}
.item button{width:auto;margin:4px}.price{background:#f0a500;color:#fff}.avail{background:#20b15a;color:#fff}.del{background:#d93025;color:#fff}
.msg{padding:10px;margin:8px 0;border-radius:6px;font-weight:bold}.error{background:#fde2e0;color:#9d1c13}.ok{background:#dff5e7;color:#126b35}
.hide{display:none}.center{text-align:center}.preview,.menuImage{width:100%;max-width:330px;max-height:230px;object-fit:cover;border-radius:8px;margin:8px 0}
.preview{display:none}.small{font-size:13px;color:#666}
</style>
</head>
<body>

<header>
<h1>QzzCityRestaurant</h1>
<p>Admin Panel • Menu Management</p>
</header>

<div id="login" class="login">
<h2 class="center">🔐 Admin Login</h2>
<div id="loginMsg"></div>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" class="loginBtn">🔐 LOGIN</button>
</div>

<div id="admin" class="box hide">

<section>
<strong>Logged in as:</strong> <span id="user"></span>
<button id="logout" class="logout">🚪 LOG OUT</button>
<div style="clear:both"></div>
</section>

<div id="msg"></div>

<section>
<h2>➕ Add Menu Item</h2>
<input id="name" placeholder="Food Name">
<select id="category">
<option>COMBO</option><option>BURGER</option><option>CHICKEN</option><option>CHIPS</option><option>OTHER</option>
</select>
<input id="price" type="number" min="0" step=".01" placeholder="Price (R)">
<textarea id="description" placeholder="Description"></textarea>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
<p class="small">JPG, PNG or WebP • Maximum 5 MB</p>
<img id="preview" class="preview">
<button id="add" class="add">➕ ADD MENU ITEM</button>
</section>

<section>
<h2>🍔 Current Menu</h2>
<div id="menu">Loading...</div>
</section>

<section>
<h2>📍 Business Information</h2>
<input id="businessName" placeholder="Business Name">
<input id="location" placeholder="Location">
<input id="whatsapp" placeholder="WhatsApp Number">
<input id="delivery" placeholder="Delivery Information">
<button id="save" class="save">💾 SAVE BUSINESS INFORMATION</button>
</section>

<section>
<h2>🌐 Customer Website</h2>
<a href="./index.html" target="_blank"><button>🌐 OPEN CUSTOMER WEBSITE</button></a>
</section>

</div>

<script>
const URL="https://namhbnphcrxjmgkbtqgs.supabase.co";
const KEY="sb_publishable_ih6Pt7CbuGlDRV3p5jZwMQ_NcA9J7tK";
const BUCKET="menu-images";
let session=null;
const $=id=>document.getElementById(id);

function safe(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function message(id,text,error=false){
$(id).innerHTML='<div class="msg '+(error?"error":"ok")+'">'+safe(text)+'</div>';
}

async function refresh(){
if(!session?.refresh_token)return false;
try{
let r=await fetch(URL+"/auth/v1/token?grant_type=refresh_token",{
method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},
body:JSON.stringify({refresh_token:session.refresh_token})
});
if(!r.ok)return false;
let d=await r.json();
if(!d.access_token)return false;
session={...session,...d};
localStorage.setItem("qzzcity_session",JSON.stringify(session));
return true;
}catch(e){return false}
}

async function api(path,opt={}){
if(!session)throw Error("Please log in again.");
let h={apikey:KEY,Authorization:"Bearer "+session.access_token};
if(opt.body && !(opt.body instanceof File) && !(opt.body instanceof FormData))
h["Content-Type"]="application/json";
if(opt.headers)Object.assign(h,opt.headers);
let r=await fetch(URL+path,{...opt,headers:h});
if((r.status==401||r.status==403)&&await refresh()){
h={apikey:KEY,Authorization:"Bearer "+session.access_token};
if(opt.body && !(opt.body instanceof File) && !(opt.body instanceof FormData))
h["Content-Type"]="application/json";
if(opt.headers)Object.assign(h,opt.headers);
r=await fetch(URL+path,{...opt,headers:h});
}
return r;
}

$("loginBtn").onclick=async()=>{
let email=$("email").value.trim(),password=$("password").value;
if(!email||!password)return message("loginMsg","Enter email and password.",true);
$("loginBtn").disabled=true;
$("loginBtn").textContent="⏳ LOGGING IN...";
try{
let r=await fetch(URL+"/auth/v1/token?grant_type=password",{
method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},
body:JSON.stringify({email,password})
});
let t=await r.text(),d={};
try{d=JSON.parse(t)}catch(e){}
if(!r.ok)throw Error(d.error_description||d.message||t||"Login failed");
session=d;
localStorage.setItem("qzzcity_session",JSON.stringify(session));
show();
}catch(e){message("loginMsg","Login failed: "+e.message,true)}
$("loginBtn").disabled=false;
$("loginBtn").textContent="🔐 LOGIN";
};

function show(){
$("login").classList.add("hide");
$("admin").classList.remove("hide");
$("user").textContent=session.user?.email||"Admin";
loadMenu();loadBusiness();
}

$("logout").onclick=()=>{
session=null;
localStorage.removeItem("qzzcity_session");
$("admin").classList.add("hide");
$("login").classList.remove("hide");
};

$("photo").onchange=()=>{
let f=$("photo").files[0];
$("preview").style.display="none";
if(!f)return;
if(!["image/jpeg","image/png","image/webp"].includes(f.type)||f.size>5242880){
message("msg","Use JPG, PNG or WebP under 5 MB.",true);
$("photo").value="";return;
}
let r=new FileReader();
r.onload=e=>{$("preview").src=e.target.result;$("preview").style.display="block"};
r.readAsDataURL(f);
};

async function upload(f){
if(!f)return null;
let ext=f.type=="image/png"?"png":f.type=="image/webp"?"webp":"jpg";
let path=Date.now()+"-"+Math.random().toString(36).slice(2)+ "."+ext;
let r=await api("/storage/v1/object/"+BUCKET+"/"+path,{
method:"POST",headers:{"x-upsert":"false"},body:f
});
if(!r.ok)throw Error(await r.text());
return URL+"/storage/v1/object/public/"+BUCKET+"/"+path;
}

$("add").onclick=async()=>{
let name=$("name").value.trim(),category=$("category").value;
let price=Number($("price").value),description=$("description").value.trim();
let f=$("photo").files[0];
if(!name||isNaN(price)||price<0)return message("msg","Enter food name and valid price.",true);
$("add").disabled=true;$("add").textContent="⏳ SAVING...";
try{
let image_url=await upload(f);
let r=await api("/rest/v1/menu_items",{
method:"POST",headers:{Prefer:"return=minimal"},
body:JSON.stringify({name,category,price,description,image_url,is_available:false})
});
if(!r.ok)throw Error(await r.text());
$("name").value="";$("price").value="";$("description").value="";$("photo").value="";
$("preview").style.display="none";
message("msg","Menu item added successfully! 🎉");
loadMenu();
}catch(e){message("msg","Could not add item: "+e.message,true)}
$("add").disabled=false;$("add").textContent="➕ ADD MENU ITEM";
};

async function loadMenu(){
$("menu").innerHTML="Loading menu...";
try{
let r=await api("/rest/v1/menu_items?select=*&order=id.asc");
if(!r.ok)throw Error(await r.text());
let items=await r.json();
if(!items.length){$("menu").innerHTML="<p class='center'>No menu items yet.</p>";return}
$("menu").innerHTML="";
items.forEach(x=>{
let d=document.createElement("div");d.className="item";
let h=document.createElement("h3");h.textContent=x.name;d.appendChild(h);
if(x.image_url){let i=document.createElement("img");i.src=x.image_url;i.className="menuImage";d.appendChild(i)}
let p=document.createElement("p");p.textContent=(x.category||"OTHER")+" • R"+Number(x.price||0).toFixed(2);d.appendChild(p);
let s=document.createElement("strong");s.textContent=x.is_available?"🟢 AVAILABLE":"🔴 UNAVAILABLE";d.appendChild(s);
d.appendChild(document.createElement("br"));

let b=document.createElement("button");b.className="price";b.textContent="💰 CHANGE PRICE";b.onclick=()=>changePrice(x.id,x.price);
let a=document.createElement("button");a.className="avail";a.textContent=x.is_available?"🔴 MARK UNAVAILABLE":"🟢 MARK AVAILABLE";a.onclick=()=>toggle(x.id,x.is_available);
let del=document.createElement("button");del.className="del";del.textContent="🗑️ DELETE";del.onclick=()=>remove(x.id,x.image_url);
d.append(b,a,del);$("menu").appendChild(d);
});
}catch(e){$("menu").innerHTML="<div class='msg error'>Could not load menu:<br>"+safe(e.message)+"</div>"}
}

async function changePrice(id,old){
let v=prompt("New price (R):",old);if(v===null)return;
let price=Number(v);if(isNaN(price)||price<0)return alert("Enter a valid price.");
try{
let r=await api("/rest/v1/menu_items?id=eq."+encodeURIComponent(id),{
method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({price})
});
if(!r.ok)throw Error(await r.text());
message("msg","Price updated! 💰");loadMenu();
}catch(e){message("msg","Could not update price: "+e.message,true)}
}

async function toggle(id,current){
try{
let r=await api("/rest/v1/menu_items?id=eq."+encodeURIComponent(id),{
method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({is_available:!current})
});
if(!r.ok)throw Error(await r.text());
message("msg","Availability updated! ✅");loadMenu();
}catch(e){message("msg","Could not update availability: "+e.message,true)}
}

async function remove(id,image){
if(!confirm("Delete this menu item?"))return;
try{
let r=await api("/rest/v1/menu_items?id=eq."+encodeURIComponent(id),{method:"DELETE"});
if(!r.ok)throw Error(await r.text());
message("msg","Menu item deleted.");loadMenu();
}catch(e){message("msg","Could not delete item: "+e.message,true)}
}

async function loadBusiness(){
try{
let r=await api("/rest/v1/business_settings?select=*&limit=1");
if(!r.ok)return;
let d=await r.json();
if(d.length){
let x=d[0];
$("businessName").value=x.business_name||"";
$("location").value=x.location||"";
$("whatsapp").value=x.whatsapp_number||"";
$("delivery").value=x.delivery_information||"";
}
}catch(e){}
}

$("save").onclick=async()=>{
let body={
business_name:$("businessName").value.trim(),
location:$("location").value.trim(),
whatsapp_number:$("whatsapp").value.trim(),
delivery_information:$("delivery").value.trim()
};
$("save").disabled=true;
try{
let c=await api("/rest/v1/business_settings?select=id&limit=1");
if(!c.ok)throw Error(await c.text());
let d=await c.json(),r;
if(d.length){
r=await api("/rest/v1/business_settings?id=eq."+encodeURIComponent(d[0].id),{
method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)
});
}else{
r=await api("/rest/v1/business_settings",{
method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)
});
}
if(!r.ok)throw Error(await r.text());
message("msg","Business information saved! 💾");
}catch(e){message("msg","Could not save: "+e.message,true)}
$("save").disabled=false;
};

(async()=>{
try{
let s=JSON.parse(localStorage.getItem("qzzcity_session")||"null");
if(s?.access_token){
session=s;
if(s.refresh_token)await refresh();
if(session)show();
}
}catch(e){localStorage.removeItem("qzzcity_session")}
})();
</script>
</body>
  </html>
