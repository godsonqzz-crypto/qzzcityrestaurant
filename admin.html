<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QzzCityRestaurant Admin</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;background:#f4f4f4;color:#111}
header{background:#111;color:#fff;text-align:center;padding:20px;border-bottom:5px solid #ffd400}
header h1{color:#ffd400;margin:0 0 5px}
.box{max-width:900px;margin:20px auto;padding:15px}
section,.login{background:#fff;padding:20px;margin-bottom:20px;border-radius:10px;box-shadow:0 2px 8px #ccc}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:6px;font-size:16px}
input,select,textarea{border:1px solid #ccc}
button{border:0;font-weight:bold;cursor:pointer}
.loginBtn{background:#ffd400}
.add{background:#20b15a;color:#fff}
.save{background:#1769aa;color:#fff}
.logout{background:#d93025;color:#fff;width:auto}
.item{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px}
.item button{width:auto;margin-right:5px}
.price{background:#f0a500;color:#fff}
.avail{background:#20b15a;color:#fff}
.del{background:#d93025;color:#fff}
.msg{padding:10px;margin:10px 0;border-radius:6px;font-weight:bold}
.error{background:#fde2e0;color:#9d1c13}
.ok{background:#dff5e7;color:#126b35}
.hide{display:none}
.center{text-align:center}
</style>
</head>

<body>

<header>
<h1>QzzCityRestaurant</h1>
<p>Admin Panel • Menu Management</p>
</header>

<!-- LOGIN -->
<div id="login" class="login" style="max-width:450px">

<h2 class="center">🔐 Admin Login</h2>

<div id="loginMsg"></div>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="loginBtn" class="loginBtn">🔐 LOGIN</button>

</div>


<!-- ADMIN -->
<div id="admin" class="box hide">

<section>
<strong>Logged in as:</strong>
<span id="user"></span>
<button id="logout" class="logout">🚪 LOG OUT</button>
</section>

<div id="msg"></div>


<!-- ADD MENU -->
<section>
<h2>➕ Add Menu Item</h2>

<input id="name" placeholder="Food Name">

<select id="category">
<option>COMBO</option>
<option>BURGER</option>
<option>CHICKEN</option>
<option>CHIPS</option>
<option>OTHER</option>
</select>

<input id="price" type="number" placeholder="Price (R)" min="0">

<textarea id="description" placeholder="Description"></textarea>

<button id="add" class="add">➕ ADD MENU ITEM</button>
</section>


<!-- MENU -->
<section>
<h2>🍔 Current Menu</h2>
<div id="menu">Loading...</div>
</section>


<!-- BUSINESS -->
<section>
<h2>📍 Business Information</h2>

<input id="businessName" placeholder="Business Name">
<input id="location" placeholder="Location">
<input id="whatsapp" placeholder="WhatsApp Number">
<input id="delivery" placeholder="Delivery Information">

<button id="save" class="save">💾 SAVE BUSINESS INFORMATION</button>
</section>


<!-- WEBSITE -->
<section>
<h2>🌐 Customer Website</h2>

<a href="./index.html" target="_blank">
<button>🌐 OPEN CUSTOMER WEBSITE</button>
</a>
</section>

</div>


<script>

const URL="https://namhbnphcrxjmgkbtqgs.supabase.co";
const KEY="sb_publishable_ih6Pt7CbuGlDRV3p5jZwMQ_NcA9J7tK";

let session=null;

const $=id=>document.getElementById(id);

function message(id,text,error=false){
$(id).innerHTML='<div class="msg '+(error?'error':'ok')+'">'+text+'</div>';
}

async function api(path,opt={}){
if(!session)throw Error("Please log in again.");

return fetch(URL+path,{
...opt,
headers:{
apikey:KEY,
Authorization:"Bearer "+session.access_token,
"Content-Type":"application/json",
...(opt.headers||{})
}
});
}


/* LOGIN */

$("loginBtn").onclick=async()=>{

let email=$("email").value.trim();
let password=$("password").value;

if(!email||!password){
message("loginMsg","Enter your email and password.",true);
return;
}

$("loginBtn").disabled=true;
$("loginBtn").textContent="⏳ LOGGING IN...";

try{

let r=await fetch(
URL+"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
apikey:KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({email,password})
});

let text=await r.text();
let data={};

try{data=JSON.parse(text)}catch(e){}

if(!r.ok)
throw Error(
data.error_description||
data.msg||
data.message||
text||
"Login failed"
);

if(!data.access_token)
throw Error("No login token received.");

session=data;

localStorage.setItem(
"qzzcity_session",
JSON.stringify(data)
);

showAdmin();

}catch(e){

message("loginMsg","Login failed: "+e.message,true);

}

$("loginBtn").disabled=false;
$("loginBtn").textContent="🔐 LOGIN";

};


/* SHOW ADMIN */

function showAdmin(){

$("login").classList.add("hide");
$("admin").classList.remove("hide");

$("user").textContent=session.user?.email||"Admin";

loadMenu();
loadBusiness();

}


/* LOGOUT */

$("logout").onclick=()=>{

session=null;
localStorage.removeItem("qzzcity_session");

$("admin").classList.add("hide");
$("login").classList.remove("hide");

};


/* ADD MENU */

$("add").onclick=async()=>{

let name=$("name").value.trim();
let category=$("category").value;
let price=Number($("price").value);
let description=$("description").value.trim();

if(!name||isNaN(price)){
message("msg","Enter food name and valid price.",true);
return;
}

try{

let r=await api("/rest/v1/menu_items",{
method:"POST",
headers:{Prefer:"return=minimal"},
body:JSON.stringify({
name,
category,
price,
description,
is_available:false
})
});

if(!r.ok)throw Error(await r.text());

$("name").value="";
$("price").value="";
$("description").value="";

message("msg","Menu item added successfully! 🎉");
loadMenu();

}catch(e){
message("msg","Could not add item: "+e.message,true);
}

};


/* LOAD MENU */

async function loadMenu(){

$("menu").innerHTML="Loading menu...";

try{

let r=await api(
"/rest/v1/menu_items?select=*&order=id.asc"
);

if(!r.ok)throw Error(await r.text());

let items=await r.json();

if(!items.length){
$("menu").innerHTML="<p class='center'>No menu items yet.</p>";
return;
}

$("menu").innerHTML="";

items.forEach(x=>{

let available=x.is_available===true;

let div=document.createElement("div");
div.className="item";

div.innerHTML=
"<h3>"+safe(x.name||"Menu Item")+"</h3>"+
"<p>"+safe(x.category||"OTHER")+" • R"+Number(x.price||0).toFixed(2)+"</p>"+
"<p>"+safe(x.description||"")+"</p>"+
"<strong>"+(available?"🟢 AVAILABLE":"🔴 UNAVAILABLE")+"</strong><br>";

let priceBtn=document.createElement("button");
priceBtn.className="price";
priceBtn.textContent="💰 CHANGE PRICE";
priceBtn.onclick=()=>changePrice(x.id,x.price);

let availBtn=document.createElement("button");
availBtn.className="avail";
availBtn.textContent=available?"🔴 MARK UNAVAILABLE":"🟢 MARK AVAILABLE";
availBtn.onclick=()=>toggle(x.id,available);

let delBtn=document.createElement("button");
delBtn.className="del";
delBtn.textContent="🗑️ DELETE";
delBtn.onclick=()=>removeItem(x.id);

div.append(priceBtn,availBtn,delBtn);

$("menu").appendChild(div);

});

}catch(e){

$("menu").innerHTML=
"<p class='msg error'>Could not load menu:<br>"+safe(e.message)+"</p>";

}

}


/* CHANGE PRICE */

async function changePrice(id,old){

let value=prompt("New price (R):",old);

if(value===null)return;

let price=Number(value);

if(isNaN(price)||price<0){
alert("Enter a valid price.");
return;
}

try{

let r=await api(
"/rest/v1/menu_items?id=eq."+id,
{
method:"PATCH",
headers:{Prefer:"return=minimal"},
body:JSON.stringify({price})
});

if(!r.ok)throw Error(await r.text());

message("msg","Price updated! 💰");
loadMenu();

}catch(e){
message("msg","Could not update price: "+e.message,true);
}

}


/* AVAILABILITY */

async function toggle(id,current){

try{

let r=await api(
"/rest/v1/menu_items?id=eq."+id,
{
method:"PATCH",
headers:{Prefer:"return=minimal"},
body:JSON.stringify({is_available:!current})
});

if(!r.ok)throw Error(await r.text());

message("msg","Availability updated! ✅");
loadMenu();

}catch(e){
message("msg","Could not update availability: "+e.message,true);
}

}


/* DELETE */

async function removeItem(id){

if(!confirm("Delete this menu item?"))return;

try{

let r=await api(
"/rest/v1/menu_items?id=eq."+id,
{method:"DELETE"}
);

if(!r.ok)throw Error(await r.text());

message("msg","Menu item deleted.");
loadMenu();

}catch(e){
message("msg","Could not delete item: "+e.message,true);
}

}


/* BUSINESS INFO */

async function loadBusiness(){

try{

let r=await api(
"/rest/v1/business_settings?select=*&limit=1"
);

if(!r.ok)return;

let data=await r.json();

if(data.length){

let x=data[0];

$("businessName").value=x.business_name||"";
$("location").value=x.location||"";
$("whatsapp").value=x.whatsapp_number||"";
$("delivery").value=x.delivery_information||"";

}

}catch(e){
console.log(e);
}

}


/* SAVE BUSINESS */

$("save").onclick=async()=>{

let body={
business_name:$("businessName").value.trim(),
location:$("location").value.trim(),
whatsapp_number:$("whatsapp").value.trim(),
delivery_information:$("delivery").value.trim()
};

try{

let check=await api(
"/rest/v1/business_settings?select=id&limit=1"
);

if(!check.ok)throw Error(await check.text());

let data=await check.json();
let r;

if(data.length){

r=await api(
"/rest/v1/business_settings?id=eq."+data[0].id,
{
method:"PATCH",
headers:{Prefer:"return=minimal"},
body:JSON.stringify(body)
}
);

}else{

r=await api(
"/rest/v1/business_settings",
{
method:"POST",
headers:{Prefer:"return=minimal"},
body:JSON.stringify(body)
}
);

}

if(!r.ok)throw Error(await r.text());

message("msg","Business information saved! 💾");

}catch(e){

message("msg","Could not save: "+e.message,true);

}

};


/* SECURITY */

function safe(x){

return String(x)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* REMEMBER LOGIN */

try{

let saved=localStorage.getItem("qzzcity_session");

if(saved){

let s=JSON.parse(saved);

if(s&&s.access_token){

session=s;
showAdmin();

}

}

}catch(e){

localStorage.removeItem("qzzcity_session");

}

</script>

</body>
  </html>
