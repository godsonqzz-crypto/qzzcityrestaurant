  <style>
    :root{
      --yellow:#ffd400;
      --black:#111;
      --dark:#1b1b1b;
      --white:#fff;
      --gray:#f4f4f4;
      --green:#25d366;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--gray);
      color:var(--black);
      line-height:1.5;
    }

    header{
      background:var(--black);
      color:white;
      position:sticky;
      top:0;
      z-index:10;
      box-shadow:0 2px 12px #0003;
    }

    .nav{
      max-width:1100px;
      margin:auto;
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .logo{
      font-size:1.45rem;
      font-weight:900;
      color:var(--yellow);
      letter-spacing:.3px;
    }

    .logo span{color:white}

    nav a{
      color:white;
      text-decoration:none;
      margin-left:18px;
      font-weight:700;
      font-size:.95rem;
    }

    nav a:hover{color:var(--yellow)}

    .hero{
      background:linear-gradient(135deg,#111 0%,#252525 60%,#111 100%);
      color:white;
      padding:72px 20px;
      text-align:center;
    }

    .badge{
      display:inline-block;
      background:var(--yellow);
      color:#111;
      padding:7px 14px;
      border-radius:999px;
      font-weight:900;
      font-size:.82rem;
      margin-bottom:16px;
    }

    h1{
      font-size:clamp(2.4rem,7vw,5rem);
      line-height:.98;
      margin:0 0 18px;
      font-weight:1000;
    }

    .hero p{
      max-width:650px;
      margin:0 auto 26px;
      font-size:1.15rem;
      color:#eee;
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-block;
      padding:14px 20px;
      border-radius:10px;
      text-decoration:none;
      font-weight:900;
      border:2px solid var(--yellow);
    }

    .btn-primary{
      background:var(--yellow);
      color:#111;
    }

    .btn-secondary{color:white}

    .section{
      max-width:1100px;
      margin:auto;
      padding:55px 20px;
    }

    .section h2{
      text-align:center;
      font-size:2rem;
      margin:0 0 8px;
    }

    .sub{
      text-align:center;
      color:#666;
      margin:0 0 30px;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:18px;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:22px;
      box-shadow:0 4px 18px #0000000d;
      border:1px solid #e8e8e8;
    }

    .card h3{
      margin:0 0 7px;
      font-size:1.12rem;
    }

    .price{
      font-size:1.45rem;
      font-weight:1000;
      margin-top:10px;
    }

    .tag{
      font-size:.75rem;
      background:#eee;
      border-radius:20px;
      padding:4px 8px;
      color:#555;
    }

    .order-box{
      background:var(--yellow);
      border-radius:20px;
      padding:35px 24px;
      text-align:center;
    }

    .order-box h2{margin-top:0}

    .order-box p{
      max-width:650px;
      margin:0 auto 20px;
    }

    .whatsapp{
      background:var(--green);
      color:white;
      border-color:var(--green);
    }

    .info{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }

    .info div{
      background:white;
      border-radius:14px;
      padding:20px;
      text-align:center;
    }

    .info strong{
      display:block;
      margin-bottom:5px;
    }

    footer{
      background:#111;
      color:#bbb;
      text-align:center;
      padding:28px 20px;
    }

    .footer-brand{
      color:var(--yellow);
      font-weight:900;
    }

    .loading{
      text-align:center;
      padding:20px;
      color:#666;
    }

    @media(max-width:700px){
      nav{display:none}
      .hero{padding:58px 18px}
      .section{padding:42px 16px}
    }
  </style>
